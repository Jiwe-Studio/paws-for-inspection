server {
    listen 8080;
    root /usr/share/nginx/html;

    # Behind the ALB, nginx only sees plain HTTP on 8080 - keep its
    # trailing-slash redirects relative so they don't point at that.
    absolute_redirect off;

    # Pod probes hit this directly, not through the Ingress.
    location = /health {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location = /games/paws-for-inspection {
        return 301 /games/paws-for-inspection/;
    }

    location /games/paws-for-inspection/ {
        try_files $uri $uri/ =404;
    }

    # nginx's stock mime.types has no entry for .webmanifest.
    location ~* \.webmanifest$ {
        types {}
        default_type application/manifest+json;
    }

    # Scripts and styles are cache-busted with ?v=N; art and audio aren't,
    # so they get a short cache rather than an immutable one.
    location ~* \.(svg|png|webp|mp3|ogg|wav)$ {
        expires 1h;
    }
}
